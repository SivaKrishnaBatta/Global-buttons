<div class="button-states-grid">
  <h1>Button States Demo</h1>

  <ul class="state-header">
    <li></li>
    <li>Rest</li>
    <li>Hover</li>
    <li>Active</li>
    <li>Focus</li>
    <li>Disabled</li>
  </ul>

<ul class="variant-row">
  <li class="variant-label">Primary</li>
   <li><app-button label="Button Label" type="primary" size="small" state="rest"></app-button></li>
  <li><app-button label="Button Label" type="primary" size="small" state="hover"></app-button></li>
  <li><app-button label="Button Label" type="primary" size="small" state="active"></app-button></li>
  <li><app-button label="Button Label" type="primary" size="small" state="focus"></app-button></li>
  <li><app-button label="Button Label" type="primary" size="small" [disabled]="true"></app-button></li>
</ul>
